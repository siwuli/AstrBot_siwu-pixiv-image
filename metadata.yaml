name: pixiv_image
display_name: P站找图
short_desc: "P站找图：Pixiv 关键词/排行/画师多工具检索，均衡混排+热门收藏过滤，三档 R18 控制，代理直连"
desc: "P站找图（Pixiv Image）：拆分为多个 Agent 工具由 LLM 按用户需求自动路由——关键词搜图（默认均衡混排，结果全部来自热门池：首位保底+中段步进采样，避免总是同一批图）、每日/每周排行榜、画师作品、指定作品详情。搜索结果按收藏数过滤（默认≥1000，可配置），直发流行图片；R18 五档控制（safe/r18/r18only/r18gonly/r18g，默认 safe 仅一般向）；支持 refresh_token OAuth 自动续期与 HTTP 代理配置（如 http://127.0.0.1:7890）"
help: "问机器人「P站今日排行」「找几张miku的图」「这个画师有哪些作品」即可自动触发对应工具；指定 pixiv 作品链接/ID 可查详情"
